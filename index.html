<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1877</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-weight: 300;
            font-size: 1.2rem;
            letter-spacing: 0.5rem;
            text-transform: uppercase;
            margin-bottom: 2rem;
            opacity: 0.7;
        }

        .team {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -0.1rem;
            margin: 0;
        }

        .footer {
            margin-top: 3rem;
        }

        a {
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 0.1rem;
            padding: 0.5rem 1rem;
            border: 1px solid #333;
            transition: all 0.3s ease;
        }

        a:hover {
            background: #fff;
            color: #000;
        }

        /* Subtle fade-in */
        .fade {
            animation: fadeIn 1.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container fade">
        <h1>Coming Soon</h1>
        <div class="team">1877</div>
        <div class="footer">
            <a href="https://t.me/Org1877" target="_blank">ORG 1877</a>
        </div>
    </div>

    <script>
        // Redirect logic
        setTimeout(() => {
            window.location.href = "https://1877.to";
        }, 10000);
    </script>
</body>
</html>
